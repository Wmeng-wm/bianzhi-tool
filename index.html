  <!-- 单锭机纤维适配（扁带两层 - 修正严谨版） -->
  <div class="card">
    <div class="section-tag tag-blue">单锭机纤维适配 (物理几何版)</div>
    <div class="hint">三方联动：选择你要推算的【求解目标】，修改另外两项参数即可自动算出结果。</div>
    <div class="grid">
      <div>
        <label>求解目标</label>
        <select id="sTargetMode" onchange="doSingleCalc()" style="border-color:var(--sec); color:var(--sec); font-weight:bold;">
          <option value="D">求：纤维旦尼尔 D</option>
          <option value="W">求：预估宽度 (mm)</option>
          <option value="P">求：编织节距 (mm)</option>
        </select>
      </div>
      <div><label>总锭数 (压扁双层通常为偶数)</label><input id="sSpindles" type="number" value="16" oninput="doSingleCalc()"></div>
      
      <div><label>目标宽度 W (mm)</label><input id="targetW" type="number" step="0.01" value="15" oninput="doSingleCalc()"></div>
      <div><label>纤维旦尼尔 D</label><input id="fiberD" type="number" step="0.01" value="1000" oninput="doSingleCalc()"></div>
      <div><label>单丝节距 P (mm)</label><input id="sPitch" type="number" step="0.01" value="25" oninput="doSingleCalc()"></div>
      
      <div><label>纤维材料</label><select id="sMaterial" onchange="doSingleCalc()">
        <option value="0.01189">聚乙烯 PE (ρ≈1.00)</option>
        <option value="0.01247">聚丙烯 PP (ρ≈0.91)</option>
        <option value="0.01012">涤纶 PET (ρ≈1.38)</option>
        <option value="0.01114">尼龙 PA (ρ≈1.14)</option>
        <option value="0.00746">玻璃纤维 (ρ≈2.54)</option>
        <option value="0.00886">碳纤维 (ρ≈1.80)</option>
      </select></div>
      <div><label>排列系数 f (0.80 极松 ~ 1.00 极紧)</label><input id="sDensity" type="number" step="0.01" min="0.80" max="1.00" value="0.90" oninput="doSingleCalc()"></div>
      <div><label>工艺结构 (仅供参考)</label>
        <select id="sCraft"><option value="1x1">一压一 (较紧实)</option><option value="1x2" selected>一压二 (常规)</option><option value="2x2">二压二 (易排布)</option></select>
      </div>
    </div>
  </div>

  <!-- 单锭机结果 -->
  <div class="card">
    <div class="out">
      <div class="kpi kpi-sec"><div class="t">编织夹角 (计算值)</div><div class="v" id="sAngleOut">-</div><div class="s">2 × 单丝角 θ</div></div>
      <div class="kpi"><div class="t">计算结果预留1</div><div class="v" id="sRes1">-</div><div class="s">视求解目标而定</div></div>
      <div class="kpi"><div class="t">计算结果预留2</div><div class="v" id="sRes2">-</div><div class="s">视求解目标而定</div></div>
      <div class="kpi"><div class="t">单根纤维直径</div><div class="v" id="sDiaOut">-</div><div class="s">单位: mm</div></div>
    </div>
  </div>
